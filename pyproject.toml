[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "claude-skills"
version = "0.1.0"
description = "Inventory and explain Claude-related capabilities on a local machine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.16.0",
  "rich>=14.0.0",
  "pydantic>=2.11.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
claude-skill = "claude_skills.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["claude_skills"]
